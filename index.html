<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ultrakickoff</title><link rel="stylesheet" href="css/style.css"/></head><body><header><h1>ULTRAKICKOFF</h1><nav><button data-tab="dash">Dash</button><button data-tab="squad">Squad</button><button data-tab="taktik">Taktik</button><button data-tab="match">Match</button><button data-tab="akademi">Akademi</button><button data-tab="inbox">Inbox</button><button data-tab="board">Board</button></nav></header><main><section id="tab-dash"><h2>Klub</h2><select id="clubSelect"></select><button id="startBtn">Mulai</button><div id="dashInfo"></div></section><section id="tab-squad" hidden><h2>Squad (umur/stamina/puas)</h2><div id="squadList"></div></section><section id="tab-taktik" hidden><h2>Taktik bebas</h2><label>Formasi <select id="t-form"><option>4-4-2</option><option>4-3-3</option><option>3-5-2</option><option>5-4-1</option><option>4-2-3-1</option></select></label><label>Garis <input id="t-line" type="range" min="0" max="100" value="50"></label><label>Press <input id="t-press" type="range" min="0" max="100" value="50"></label><label>Tempo <input id="t-tempo" type="range" min="0" max="100" value="50"></label><label>Build-up <select id="t-build"><option>tengah</option><option>kiri</option><option>kanan</option><option>campuran</option></select></label><label>Panjang <select id="t-passlen"><option>pendek</option><option>campuran</option><option>panjang</option></select></label><label>Arah <select id="t-passdir"><option>maju</option><option>kiri</option><option>kanan</option><option>campuran</option></select></label><button id="saveTaktik">Simpan</button></section><section id="tab-match" hidden><h2>Match</h2><label><input id="refBribe" type="checkbox"> Sogok wasit (risiko media)</label><button id="simBtn">Simulasi</button><pre id="liveLog"></pre></section><section id="tab-akademi" hidden><h2>Akademi 14-20</h2><button id="intakeBtn">Intake</button><div id="academyList"></div></section><section id="tab-inbox" hidden><h2>Inbox/Media/Bang R</h2><button id="titipanBtn">Event titipan</button><select id="pressSel"><option>sombong</option><option>rendah</option><option>aman</option></select><button id="pressBtn">Presscon</button><div id="inboxList"></div></section><section id="tab-board" hidden><h2>Board/Sponsor/Fans/Stadion</h2><div id="boardInfo"></div></section></main><script src="js/config.js"></script><script src="js/teams.js"></script><script src="js/tactics.js"></script><script src="js/engine.js"></script><script src="js/manager.js"></script><script src="js/app.js"></script></body></html>
