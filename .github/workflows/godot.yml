name: godot
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip curl
      - name: Setup Android SDK
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Install Godot 4.3 + templates
        run: |
          set -e
          GODOT_V="4.3-stable"
          mkdir -p /tmp/godot-ci
          cd /tmp/godot-ci
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_V}/Godot_v${GODOT_V}_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x Godot_v${GODOT_V}_linux.x86_64
          sudo mv Godot_v${GODOT_V}_linux.x86_64 /usr/local/bin/godot
          godot --version
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_V}/Godot_v${GODOT_V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -o templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable
          if [ -d ~/.local/share/godot/export_templates/4.3.stable/templates ]; then
            mv ~/.local/share/godot/export_templates/4.3.stable/templates/* ~/.local/share/godot/export_templates/4.3.stable/
            rmdir ~/.local/share/godot/export_templates/4.3.stable/templates || true
          fi
          ls ~/.local/share/godot/export_templates/4.3.stable | head -n 20
      - name: Generate debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la ~/.android/debug.keystore
      - name: Import (tanpa HTML5)
        run: |
          set -e
          godot --headless --path godot --import
          echo "IMPORT_OK"
          test -f godot/export_presets.cfg
          if grep -qi '"Web"\|platform="Web"' godot/export_presets.cfg; then
            echo "FORBIDDEN_WEB_PRESET_FOUND"
            exit 1
          fi
          echo "NO_WEB_PRESET_OK"
      - name: Validate GDScript
        run: |
          set -e
          for f in godot/scripts/config.gd godot/scripts/teams.gd godot/scripts/tactics.gd godot/scripts/engine.gd godot/scripts/manager.gd godot/scripts/main.gd; do
            echo "CHECK $f"
            godot --headless --path godot --check-only --script "res://${f#godot/}"
          done
          echo "GDSCRIPT_CHECK_OK"
      - name: Export Android APK (debug)
        run: |
          set -e
          mkdir -p build/android
          godot --headless --path godot --export-debug "Android" "../build/android/ultrakickoff-debug.apk"
          ls -lh build/android
          echo "EXPORT_APK_OK"
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakickoff-android-apk
          path: build/android/*.apk
          if-no-files-found: error
