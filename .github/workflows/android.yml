name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx cap add android || true
      - run: npx cap sync || true
      - run: |
          if [ -f android/gradlew ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          else
            echo "NO_ANDROID_PLATFORM"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakickoff-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release:
    needs: debug
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx cap add android || true
      - run: npx cap sync || true
      - run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/ultrakickoff-rel.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file=/tmp/ultrakickoff-rel.jks -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakickoff-release
          path: android/app/build/outputs/apk/release/*.apk
