name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/
          cp -r css js data www/
          ls -R www | head -n 30
      - run: npx cap add android
      - run: npx cap sync
      - run: |
          if [ -f android/gradlew ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          else
            echo "NO_ANDROID_PLATFORM"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakickoff-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/
          cp -r css js data www/
          ls -R www | head -n 30
      - run: npx cap add android
      - run: npx cap sync
      - run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "SKIP_RELEASE_NO_SECRETS"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/ultrakickoff-rel.jks
          ls -la /tmp/ultrakickoff-rel.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: |
          if [ ! -f /tmp/ultrakickoff-rel.jks ]; then
            echo "SKIP_SIGNED_BUILD_NO_KEYSTORE"
            exit 0
          fi
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file=/tmp/ultrakickoff-rel.jks -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakickoff-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
