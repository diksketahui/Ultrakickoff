# Ultrakickoff Godot export presets - Desktop only, tanpa web export.
# Sengaja tidak ada preset web sesuai permintaan: jangan buat jadi html5.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/linux/ultrakickoff.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
texture_format/astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}\\{archive_name}\\unzipped' -Force:$true; & $cygpath '{temp_dir}\\{archive_name}\\unzipped\\{exe_name}' {cmd_args}"
ssh_remote_deploy/cleanup_script="if (Test-Path '{temp_dir}\\{archive_name}') {Remove-Item -Recurse -Force '{temp_dir}\\{archive_name}'}"

